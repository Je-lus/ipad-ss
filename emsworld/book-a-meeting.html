<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>MedEdPrep — EMS World Expo 2026 — Book a meeting card</title>
<!-- Source for book-a-meeting.png (1080x1920 phone card). Re-render at 1080x1920 with a headless browser. -->
<style>
  @font-face { font-family:'Poppins'; font-weight:500; src:url(fonts/poppins-500.woff2) format('woff2'); }
  @font-face { font-family:'Poppins'; font-weight:600; src:url(fonts/poppins-600.woff2) format('woff2'); }
  @font-face { font-family:'Poppins'; font-weight:800; src:url(fonts/poppins-800.woff2) format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; }
  body {
    font-family:'Poppins', system-ui, sans-serif; color:#fff;
    background:#0A0A0A;
    background-image: radial-gradient(ellipse 70% 45% at 50% 62%, rgba(27,95,208,0.18), rgba(10,10,10,0) 70%);
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:120px 80px 96px;
  }
  .logo { width:420px; height:auto; margin-bottom:96px; }
  .eyebrow { font-weight:600; font-size:34px; letter-spacing:0.32em; text-transform:uppercase; color:#36C98D; margin-bottom:34px; }
  h1 { font-weight:800; font-size:104px; line-height:1.02; letter-spacing:-0.02em; margin-bottom:40px; }
  .sub { font-weight:500; font-size:40px; color:#8A8A8A; margin-bottom:70px; }
  .plate { background:#fff; border-radius:52px; padding:84px; box-shadow:0 0 120px rgba(1,205,171,0.18); }
  .plate img { display:block; width:520px; height:520px; image-rendering:pixelated; }
  .url { font-weight:600; font-size:48px; color:#36C98D; margin-top:64px; margin-bottom:48px; }
  .site { margin-top:auto; font-weight:600; font-size:30px; letter-spacing:0.28em; text-transform:uppercase; color:#8A8A8A; }
</style></head>
<body>
  <img class="logo" src="logo-mep-white.svg" alt="MedEdPrep">
  <div class="eyebrow">EMS World Expo 2026</div>
  <h1>Book a meeting<br>with us.</h1>
  <div class="sub">Point your camera at the code</div>
  <div class="plate"><img src="qr-leadform.png" alt="QR code: team.mededprep.app/emsworld"></div>
  <div class="url">team.mededprep.app/emsworld</div>
  <div class="site">mededprep.com</div>
</body></html>
